<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e5c4f">
  <title>היומן שלי</title>
  <script>try{var t=localStorage.getItem("diaryTheme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="style.css">

<style>
/* teacher mode: the portal around it provides the header and the tabs; only the week and the lesson report remain */
.top, .tabs, #view-absences, #view-tt, #view-fills, #themeBtn { display: none !important; }
main { padding-top: 6px !important; padding-bottom: 28px !important; }
#dyConnect { z-index: 60; }
</style>
</head>
<body>
  <div id="login" class="login hidden">
    <form class="login-card" id="loginForm">
      <div class="brand big"><svg class="nib" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 6.5 9.2l1.3 7.3L12 21.5l4.2-5 1.3-7.3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 13.2V21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="11.4" r="1.6" fill="currentColor"/></svg><span>יומן מורה</span></div>
      <p class="muted">כניסה לממשק</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="סיסמה" required>
      <button class="btn primary wide" type="submit">כניסה</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <div class="brand"><svg class="nib" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 6.5 9.2l1.3 7.3L12 21.5l4.2-5 1.3-7.3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 13.2V21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="11.4" r="1.6" fill="currentColor"/></svg><span>יומן מורה</span></div>
      <nav class="tabs" role="tablist" aria-label="מסכים">
        <button class="tab active" data-view="week" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8.5 4.5v-2M15.5 4.5v-2M8 14h2M14 14h2"/></svg><span class="t-full">מערכת ויומן</span><span class="t-short">יומן</span></button>
        <button class="tab" data-view="absences" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="8.5" r="3.5"/><path d="M3.5 20c.4-3.4 2.9-5.5 6-5.5s5.6 2.1 6 5.5M16.5 8.5h5"/></svg><span class="t-full">היעדרויות מורים</span><span class="t-short">היעדרויות</span></button>
        <button class="tab" data-view="tt" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="t-full">מערכת שעות</span><span class="t-short">שעות</span></button>
        <button class="tab" data-view="fills" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h13l-3-3M19 16H6l3 3"/></svg><span class="t-full">מילויי מקום</span><span class="t-short">מילויים</span></button>
      </nav>
      <div class="who" id="who"></div>
      <button class="icon-btn" id="themeBtn" type="button"></button>
    </header>

    <main>
      <section id="view-week" class="view">
        <div class="toolbar">
          <div class="nav-group">
            <button class="icon-btn" id="prevWeek" title="שבוע קודם" aria-label="שבוע קודם"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
            <div class="week-label" id="weekLabel">טוען…</div>
            <button class="icon-btn" id="nextWeek" title="שבוע הבא" aria-label="שבוע הבא"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
          </div>
          <button class="btn ghost" id="thisWeek">היום</button>
          <div class="legend">
            <span><i class="mark-st done"></i>דוח הוזן</span>
            <span><i class="mark-st todo"></i>ממתין לדוח</span>
            <span><i class="mark-st future"></i>עוד לא התקיים</span>
          </div>
        </div>
        <h1 class="week-title" id="weekTitle"></h1>
        <div class="day-chips" id="dayChips"></div>
        <div class="grid-wrap"><div id="grid" class="grid"></div></div>
      </section>

      <section id="view-absences" class="view hidden">
        <h1 class="week-title" id="absTitle"></h1>
        <div class="abs-dates" id="absDates"></div>
        <div class="abs-actions">
          <button class="btn abs-new" id="newAbsence" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>היעדרות חדשה</button>
          <button class="btn abs-more" id="absMore" type="button" aria-expanded="false" aria-controls="absPanel"><span>עוד</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
        <div class="abs-quick" id="absQuick"></div>
        <div class="abs-panel" id="absPanel">
          <div class="abs-range" id="absRange"></div>
          <div class="abs-fields" id="absFields"></div>
          <div class="abs-tools" id="absTools"></div>
        </div>
        <div class="abs-stats" id="absStats"></div>
        <div id="absList" class="cards"></div>
      </section>
      <section id="view-tt" class="view hidden">
        <div class="toolbar tt-bar">
          <div class="seg" id="ttMode" role="tablist" aria-label="תצוגה">
            <button data-mode="teacher" role="tab">לפי מורה</button>
            <button data-mode="class" role="tab">לפי כיתה</button>
            <button data-mode="free" role="tab">מי פנוי</button>
          </div>
          <div class="nav-group">
            <button class="icon-btn" id="ttPrevWeek" title="שבוע קודם" aria-label="שבוע קודם"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
            <div class="week-label" id="ttWeekLabel">טוען…</div>
            <button class="icon-btn" id="ttNextWeek" title="שבוע הבא" aria-label="שבוע הבא"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
          </div>
          <button class="btn ghost" id="ttThisWeek">השבוע</button>
        </div>
        <div class="tt-who" id="ttWho"></div>
        <div class="day-chips" id="ttDayChips"></div>
        <div class="grid-wrap"><div id="ttGrid" class="grid tt-grid"></div></div>
        <div class="tt-legend" id="ttLegend">
          <span><i class="lg lesson"></i>שיעור</span>
          <span><i class="lg private"></i>פרטני</span>
          <span><i class="lg stay"></i>שהייה</span>
          <span><i class="lg other"></i>תפקיד / ישיבה</span>
          <span><i class="lg fill"></i>מילוי מקום</span>
          <span><i class="lg absent"></i>נעדר</span>
        </div>
      </section>
      <section id="view-fills" class="view hidden">
        <h1 class="week-title">מילויי מקום</h1>
        <div id="fillsBar" class="fills-bar"></div>
        <div id="fillsOut"></div>
      </section>
    </main>
  </div>

  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <aside id="sheet" class="sheet hidden" aria-modal="true" role="dialog"></aside>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="../config.js"></script>
  <script src="app.js"></script>
</body>
</html>
